<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/algojava-icon.png" />
    <title>AlgoJava</title>
    <style>
      :root {
        --splash-bg: #090912;
        --splash-surface: rgba(18, 18, 34, 0.82);
        --splash-border: rgba(148, 163, 184, 0.16);
        --splash-accent: #7c3aed;
        --splash-accent-light: #a78bfa;
        --splash-success: #22c55e;
        --splash-text: #f1f5f9;
        --splash-muted: #9aa6be;
        --splash-dim: #6b7894;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--splash-bg);
        color: var(--splash-text);
        font-family: "Outfit Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .splash-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 22px 28px 20px;
        background: radial-gradient(
            ellipse 80% 95% at 86% 12%,
            rgba(124, 58, 237, 0.24) 0%,
            rgba(49, 46, 129, 0.12) 48%,
            transparent 76%
          ),
          radial-gradient(
            ellipse 65% 75% at 10% 92%,
            rgba(56, 189, 248, 0.08) 0%,
            transparent 70%
          ),
          var(--splash-bg);
        border: 1px solid rgba(139, 92, 246, 0.34);
        overflow: hidden;
      }

      /* Top specular hairline */
      .splash-shell::before {
        content: "";
        position: absolute;
        top: 0;
        left: 24px;
        right: 24px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(167, 139, 250, 0.65) 50%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 3;
      }

      .splash-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(167, 139, 250, 0.16) 1px, transparent 1px);
        background-size: 20px 20px;
        mask-image: radial-gradient(ellipse 85% 90% at 68% 45%, #000 28%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 85% 90% at 68% 45%, #000 28%, transparent 100%);
      }

      .splash-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(48px);
        pointer-events: none;
      }

      .splash-orb-primary {
        top: -80px;
        right: -60px;
        width: 230px;
        height: 230px;
        background: rgba(124, 58, 237, 0.28);
      }

      .splash-orb-secondary {
        bottom: -85px;
        left: -45px;
        width: 190px;
        height: 190px;
        background: rgba(56, 189, 248, 0.12);
      }

      .splash-top,
      .splash-center,
      .splash-footer {
        position: relative;
        z-index: 2;
      }

      .splash-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .splash-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 11px;
        border-radius: 9999px;
        background: rgba(124, 58, 237, 0.16);
        border: 1px solid rgba(139, 92, 246, 0.4);
        color: var(--splash-accent-light);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .splash-pill-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--splash-success);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.85);
      }

      .splash-top-badges {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .splash-badge {
        padding: 4px 10px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--splash-border);
        color: var(--splash-muted);
        font-size: 11px;
        font-weight: 500;
      }

      .splash-badge-version {
        font-family: "JetBrains Mono Variable", "Consolas", monospace;
        color: var(--splash-accent-light);
        border-color: rgba(139, 92, 246, 0.35);
        background: rgba(124, 58, 237, 0.1);
      }

      .splash-center {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
      }

      .splash-brand {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .splash-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .splash-logo-ring {
        position: absolute;
        inset: -5px;
        border-radius: 18px;
        border: 1px solid rgba(167, 139, 250, 0.48);
        animation: splash-pulse 2.2s ease-in-out infinite;
      }

      .splash-logo {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: transparent;
        box-shadow: 0 14px 30px -6px rgba(124, 58, 237, 0.52);
      }

      .splash-logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .splash-title-group {
        min-width: 0;
      }

      .splash-wordmark {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.04;
        color: var(--splash-text);
      }

      .splash-wordmark-accent {
        background: linear-gradient(95deg, #c4b5fd 0%, #818cf8 55%, #60a5fa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .splash-subtitle {
        margin-top: 6px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--splash-muted);
      }

      /* Live Boot Checklist Panel */
      .splash-checklist {
        width: 196px;
        flex-shrink: 0;
        border-radius: 12px;
        background: var(--splash-surface);
        border: 1px solid var(--splash-border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 14px 30px rgba(0, 0, 0, 0.36);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .splash-checklist-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--splash-dim);
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      }

      .splash-stage {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--splash-dim);
        transition: color 180ms ease;
      }

      .splash-stage-indicator {
        position: relative;
        width: 15px;
        height: 15px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(15, 23, 42, 0.6);
        transition: all 180ms ease;
      }

      .splash-stage-indicator svg {
        width: 10px;
        height: 10px;
        opacity: 0;
        transform: scale(0.7);
        transition: all 180ms ease;
      }

      .splash-stage-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.45);
        transition: all 180ms ease;
      }

      .splash-stage[data-state="active"] {
        color: var(--splash-text);
      }

      .splash-stage[data-state="active"] .splash-stage-indicator {
        border-color: rgba(167, 139, 250, 0.65);
        background: rgba(124, 58, 237, 0.2);
        box-shadow: 0 0 10px rgba(124, 58, 237, 0.45);
      }

      .splash-stage[data-state="active"] .splash-stage-dot {
        background: var(--splash-accent-light);
      }

      .splash-stage[data-state="done"] {
        color: var(--splash-muted);
      }

      .splash-stage[data-state="done"] .splash-stage-indicator {
        border-color: rgba(34, 197, 94, 0.5);
        background: rgba(34, 197, 94, 0.16);
        color: var(--splash-success);
      }

      .splash-stage[data-state="done"] .splash-stage-dot {
        display: none;
      }

      .splash-stage[data-state="done"] .splash-stage-indicator svg {
        opacity: 1;
        transform: scale(1);
      }

      .splash-footer {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .splash-telemetry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
      }

      .splash-status {
        color: var(--splash-muted);
        font-weight: 500;
      }

      .splash-percent {
        font-variant-numeric: tabular-nums;
        font-family: "JetBrains Mono Variable", "Consolas", monospace;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--splash-accent-light);
      }

      .splash-track {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.14);
        overflow: hidden;
      }

      .splash-bar {
        position: relative;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 60%, #60a5fa 100%);
        transition: width 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        box-shadow: 0 0 12px rgba(124, 58, 237, 0.55);
        overflow: hidden;
      }

      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.35) 50%,
          transparent 100%
        );
        animation: splash-shimmer 1.5s ease-in-out infinite;
      }

      .splash-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10.5px;
        color: var(--splash-dim);
      }

      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(1);
        }
        50% {
          opacity: 0.92;
          transform: scale(1.06);
        }
      }

      @keyframes splash-shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo-ring,
        .splash-bar::after {
          animation: none;
        }
        .splash-bar,
        .splash-stage,
        .splash-stage-indicator {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-shell" data-tauri-drag-region>
      <div class="splash-grid" aria-hidden="true"></div>
      <div class="splash-orb splash-orb-primary" aria-hidden="true"></div>
      <div class="splash-orb splash-orb-secondary" aria-hidden="true"></div>

      <!-- Top Studio Bar -->
      <header class="splash-top" data-tauri-drag-region>
        <div class="splash-pill">
          <span class="splash-pill-dot"></span>
          <span>Offline Java Studio</span>
        </div>
        <div class="splash-top-badges">
          <span class="splash-badge">100% Free &amp; Offline</span>
          <span class="splash-badge splash-badge-version">v1.0.0</span>
        </div>
      </header>

      <!-- Center Hero Composition -->
      <main class="splash-center" data-tauri-drag-region>
        <div class="splash-brand">
          <div class="splash-logo-wrap">
            <div class="splash-logo-ring" aria-hidden="true"></div>
            <div class="splash-logo">
              <img src="/algojava-icon.png" alt="AlgoJava" width="64" height="64" />
            </div>
          </div>

          <div class="splash-title-group">
            <h1 class="splash-wordmark">
              Algo<span class="splash-wordmark-accent">Java</span>
            </h1>
            <p class="splash-subtitle">
              Offline Edition of CodingBat · Native Rust Core
            </p>
          </div>
        </div>

        <aside class="splash-checklist" aria-label="Startup stages">
          <div class="splash-checklist-title">Boot Sequence</div>
          <div class="splash-stage" data-stage="preferences" data-state="active">
            <span class="splash-stage-indicator">
              <span class="splash-stage-dot"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10" /></svg>
            </span>
            <span>Preferences</span>
          </div>
          <div class="splash-stage" data-stage="database" data-state="pending">
            <span class="splash-stage-indicator">
              <span class="splash-stage-dot"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10" /></svg>
            </span>
            <span>Local SQLite</span>
          </div>
          <div class="splash-stage" data-stage="jdk" data-state="pending">
            <span class="splash-stage-indicator">
              <span class="splash-stage-dot"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10" /></svg>
            </span>
            <span>Java JDK</span>
          </div>
          <div class="splash-stage" data-stage="workspace" data-state="pending">
            <span class="splash-stage-indicator">
              <span class="splash-stage-dot"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10" /></svg>
            </span>
            <span>Workspace</span>
          </div>
        </aside>
      </main>

      <!-- Bottom Telemetry Dock -->
      <footer class="splash-footer" data-tauri-drag-region>
        <div class="splash-telemetry">
          <span id="splash-status" class="splash-status">
            Initializing AlgoJava workspace...
          </span>
          <span id="splash-percent" class="splash-percent">12%</span>
        </div>
        <div class="splash-track">
          <div id="splash-bar" class="splash-bar" style="width: 12%"></div>
        </div>
        <div class="splash-meta">
          <span>Native Rust Core</span>
          <span>by Dilshod Fayzullayev (Dylan)</span>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/splash/main.ts"></script>
  </body>
</html>
